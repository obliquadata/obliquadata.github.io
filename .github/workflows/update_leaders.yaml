name: Update leaders database

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create data directory if missing
        run: mkdir -p data scripts

      - name: Run leader database generator
        run: node scripts/update-leaders.mjs

      - name: Commit updated leaders database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaders.json
          git diff --cached --quiet && exit 0
          git commit -m "Update leaders database"
          git push
