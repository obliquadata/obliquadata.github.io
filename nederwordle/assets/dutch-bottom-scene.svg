<svg width="1600" height="320" viewBox="0 0 1600 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dutch-inspired decorative skyline with canal, bridge, houses, and tulips">
  <defs>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4EA"/>
      <stop offset="1" stop-color="#FCE5D6"/>
    </linearGradient>
    <linearGradient id="orangeWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F47C20"/>
      <stop offset="1" stop-color="#FF8F3D"/>
    </linearGradient>
    <linearGradient id="blueWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B3B75"/>
      <stop offset="1" stop-color="#0D5EA6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="320" fill="url(#skyGlow)" opacity="0.001"/>

  <!-- distant shapes -->
  <circle cx="210" cy="160" r="44" fill="#F6D7C1" opacity="0.7"/>
  <circle cx="1360" cy="145" r="52" fill="#F6D7C1" opacity="0.65"/>
  <circle cx="1210" cy="110" r="24" fill="#FFF0E0" opacity="0.85"/>

