    <rect x="110" y="148" width="18" height="32" fill="#F7F3EE"/>
    <rect x="136" y="148" width="18" height="32" fill="#F7F3EE"/>
    <rect x="164" y="148" width="18" height="32" fill="#F7F3EE"/>
    <rect x="110" y="190" width="18" height="16" fill="#F0D8C8"/>
    <rect x="136" y="190" width="18" height="16" fill="#F0D8C8"/>
    <rect x="164" y="190" width="18" height="16" fill="#F0D8C8"/>
