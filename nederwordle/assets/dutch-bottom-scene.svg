    <path d="M102 180C123 198 138 220 145 252" stroke="#0B3B75" stroke-width="10" stroke-linecap="round"/>
    <path d="M91 52C112 31 126 51 131 84C136 115 118 137 91 147C65 137 46 115 51 84C56 51 71 31 91 52Z" fill="#E94F0F"/>
    <path d="M73 64C90 38 114 33 128 62C139 85 126 118 102 138C81 124 64 103 60 83C57 70 61 55 73 64Z" fill="#F47C20"/>
    <path d="M91 40C103 16 124 20 138 46C151 72 147 109 125 136C104 123 89 100 85 76C83 64 83 49 91 40Z" fill="#FF6A00"/>
    <path d="M42 250C60 223 70 206 79 181C57 187 38 202 22 228C12 245 7 261 3 274C18 269 29 262 42 250Z" fill="#0B3B75"/>
    <path d="M145 252C129 224 118 205 105 182C127 188 149 205 166 230C176 245 181 260 185 274C169 268 157 262 145 252Z" fill="#123F79"/>
