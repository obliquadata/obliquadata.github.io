    <path d="M102 285C109 242 127 220 159 220C192 220 209 242 216 285H102Z" fill="#F5E6D9"/>
    <path d="M287 285C294 252 309 235 334 235C357 235 371 252 378 285H287Z" fill="#1B4E8D" opacity="0.78"/>
